name: Get YouTube Refresh Token (Device Flow)

on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps & Get Device Code
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python -m pip install -U pip
          pip install requests

          python -u - <<'PY'
          import os
          import sys
          import time
          import requests

          try:
              sys.stdout.reconfigure(line_buffering=True)
          except:
              pass

          CLIENT_ID = os.environ["YT_CLIENT_ID"].strip()
          CLIENT_SECRET = os.environ["YT_CLIENT_SECRET"].strip()

          DEVICE_URL = "https://oauth2.googleapis.com/device/code"
          TOKEN_URL = "https://oauth2.googleapis.com/token"
          SCOPE = "https://www.googleapis.com/auth/youtube.upload"

          print("\n========================================")
          print("ĐANG LẤY DEVICE CODE...")
          print("========================================")

          r = requests.post(
              DEVICE_URL,
              data={
                  "client_id": CLIENT_ID,
                  "scope": SCOPE
              },
              timeout=30
          )

          print("HTTP:", r.status_code)

          if r.status_code != 200:
              print(r.text)
              sys.exit(1)

          data = r.json()

          verification_url = data["verification_url"]
          user_code = data["user_code"]
          device_code = data["device_code"]
          interval = int(data.get("interval", 5))

          print()
          print("========================================")
          print("URL xác minh:", verification_url)
          print("MÃ người dùng:", user_code)
          print("========================================")
          print()

          while True:

              t = requests.post(
                  TOKEN_URL,
                  data={
                      "client_id": CLIENT_ID,
                      "client_secret": CLIENT_SECRET,
                      "device_code": device_code,
                      "grant_type": "urn:ietf:params:oauth:grant-type:device_code"
                  },
                  timeout=30
              )

              print("HTTP:", t.status_code)

              try:
                  j = t.json()
              except:
                  print(t.text)
                  sys.exit(1)

              if "refresh_token" in j:
                  print()
                  print("========================================")
                  print("YT_REFRESH_TOKEN")
                  print(j["refresh_token"])
                  print("========================================")
                  break

              err = j.get("error", "")

              if err == "authorization_pending":
                  print("Đang chờ bạn xác minh...")
                  time.sleep(interval)
                  continue

              if err == "slow_down":
                  interval += 5
                  print("Google yêu cầu chậm lại...")
                  time.sleep(interval)
                  continue

              if err == "expired_token":
                  print("Device code đã hết hạn.")
                  sys.exit(1)

              if err == "access_denied":
                  print("Bạn đã từ chối cấp quyền.")
                  sys.exit(1)

              print(j)
              sys.exit(1)

          PY
